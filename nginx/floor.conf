# À mettre dans le bloc `server` HTTPS de fedoheim.hopto.org (/etc/nginx/sites-available/fedoheim.conf sur la Beemo) :
# floor répond alors sur https://fedoheim.hopto.org/floor/ (le préfixe est retiré avant floor).

# Ronnie.io : le WebSocket (les en-têtes Upgrade passent, la connexion reste ouverte longtemps).
location /floor/v1/blob/ws {
    proxy_pass http://127.0.0.1:5002/v1/blob/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

# Ronnheim : son WebSocket, pareil.
location /floor/v1/ronnheim/ws {
    proxy_pass http://127.0.0.1:5002/v1/ronnheim/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

# Ronnheim : la publication de ses versions (des archives de quelques Mo ; ailleurs, 1 Mo suffit).
location /floor/v1/ronnheim/releases/ {
    proxy_pass http://127.0.0.1:5002/v1/ronnheim/releases/;
    client_max_body_size 300m;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /floor/ {
    proxy_pass http://127.0.0.1:5002/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
