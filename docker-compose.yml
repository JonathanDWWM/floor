services:
  floor:
    build:
      context: .
      args:
        FLOOR_COMMIT: ${FLOOR_COMMIT:-}
        FLOOR_COMMIT_DATE: ${FLOOR_COMMIT_DATE:-}
    container_name: floor
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:5002"
    environment:
      # Derrière le reverse proxy : le nombre de proxys devant floor (l'adresse du joueur en dépend).
      TRUST_PROXY: "1"
      # Le jeton qui publie les versions de Ronnheim (dans ~/floor/.env sur la Beemo ; vide : fermé).
      RONNHEIM_PUBLISH_TOKEN: ${RONNHEIM_PUBLISH_TOKEN:-}
    volumes:
      - floor-data:/data

volumes:
  floor-data:
